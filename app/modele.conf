# Modèle Whisper de Murmure : seule source de ces valeurs. install.sh les lit
# ici ; Murmure.app les trouve dans ses ressources (copie de ce fichier) pour
# télécharger le modèle au premier lancement. Lignes « CLE=valeur », jamais
# exécutées.
#
# Variables d'environnement, lues par les deux (tests avec un faux modèle) :
# MURMURE_MODEL_URL remplace l'adresse, MURMURE_MODEL_SHA256 et
# MURMURE_MODEL_SIZE l'empreinte et la taille. MURMURE_MODEL_NAME prend un
# autre fichier du même dépôt, sans empreinte ni taille connues.

MODEL_NAME=ggml-large-v3-turbo-q5_0.bin
# Révision figée : l'empreinte reste valable même si le dépôt Hugging Face
# publie une nouvelle version du fichier.
MODEL_REV=5359861c739e955e79d9a303bcbc70fb988958b1
MODEL_SHA256=394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2
MODEL_SIZE=574041195
# Adresse du fichier : MODEL_REPO/MODEL_REV/MODEL_NAME.
MODEL_REPO=https://huggingface.co/ggerganov/whisper.cpp/resolve
