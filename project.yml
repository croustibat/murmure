# Murmure.app, décrite pour XcodeGen : `xcodegen generate` produit
# Murmure.xcodeproj (non versionné). Compiler : voir CONTRIBUTING.md.
name: Murmure
options:
  developmentLanguage: fr
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    # En Debug, Xcode met sinon le code de l'app dans une bibliothèque à part,
    # que la re-signature de script/sign_app.sh ne couvre pas.
    ENABLE_DEBUG_DYLIB: NO
    # `xcodebuild` seul signe ad hoc, pour que tout le monde puisse compiler ;
    # install.sh et script/build_and_run.sh compilent sans signer puis signent
    # avec un certificat (script/sign_app.sh).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # Xcode omet le runtime durci en signature ad hoc : forcé, pour qu'un build
    # de développement subisse les mêmes contraintes (micro, Apple Events) que
    # la version notarisée.
    OTHER_CODE_SIGN_FLAGS: --options runtime
# Mises à jour automatiques. Version exacte : la publication signe les helpers
# de Sparkle et utilise ses outils, leur disposition doit rester connue.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Murmure:
    type: application
    platform: macOS
    sources:
      - path: src/app
      - path: app/Murmure.icns
    settings:
      base:
        PRODUCT_NAME: Murmure
        # Inchangé : les autorisations Micro et Accessibilité suivent
        # l'identifiant et l'équipe de signature.
        PRODUCT_BUNDLE_IDENTIFIER: dev.croustibat.murmure
        INFOPLIST_FILE: app/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Pour la seule signature ad hoc de Xcode ; script/sign_app.sh re-signe
        # avec Murmure.entitlements dès qu'il y a un certificat.
        CODE_SIGN_ENTITLEMENTS: app/Murmure-adhoc.entitlements
        # Clés MurmureHome et MurmureSourceSum d'Info.plist, données par
        # install.sh sur la ligne de commande de xcodebuild.
        MURMURE_INFO_HOME: ""
        MURMURE_INFO_SOURCE_SUM: ""
        # La phase « Version » réécrit l'Info.plist produit, hors de ses sorties
        # déclarées.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Outils embarqués dans Contents/Helpers, signés un à un par
    # script/sign_app.sh. Ajouter un outil : une cible ci-dessous et un bloc ici.
    # Helpers plutôt que MacOS : sur un disque insensible à la casse, un outil
    # « murmure » y écraserait l'exécutable de l'app.
    dependencies:
      - target: overlay
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: murmure-rec
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Contents/Frameworks/Sparkle.framework, signé par script/sign_app.sh.
      - package: Sparkle
    postBuildScripts:
      # VERSION reste la seule source du numéro affiché. L'Info.plist produit
      # en entrée ordonne la phase après son traitement par Xcode.
      - name: Version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/VERSION
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -e
          v=$(tr -d '[:space:]' < "$SRCROOT/VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $v" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  # Pastille flottante affichée pendant la dictée, lancée par murmure.sh.
  overlay:
    type: tool
    platform: macOS
    sources:
      - path: src/overlay.swift
    settings:
      base:
        PRODUCT_NAME: overlay
        PRODUCT_BUNDLE_IDENTIFIER: dev.croustibat.murmure.overlay
        # Jamais installé seul : il voyage dans le bundle de l'app.
        SKIP_INSTALL: YES

  # Enregistreur du micro (WAV 16 kHz mono et niveaux pour la pastille), lancé
  # par murmure.sh à la place de ffmpeg. Son entitlement Micro est dans
  # app/murmure-rec.entitlements, que script/sign_app.sh applique.
  murmure-rec:
    type: tool
    platform: macOS
    sources:
      - path: src/rec
    settings:
      base:
        PRODUCT_NAME: murmure-rec
        PRODUCT_BUNDLE_IDENTIFIER: dev.croustibat.murmure.murmure-rec
        SKIP_INSTALL: YES
